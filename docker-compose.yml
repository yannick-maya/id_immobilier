services:

  # ── Spark Master ─────────────────────────────────────────────────────────────
  spark:
    image: apache/spark:3.5.1
    container_name: id_immobilier_spark
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8082:8080"
      - "7077:7077"
    volumes:
      - ./data:/app/data
      - ./pipeline:/app/pipeline
    networks:
      - immo_network

  # ── Spark Worker ─────────────────────────────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.1
    container_name: id_immobilier_spark_worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=1g
      - SPARK_WORKER_CORES=1
    volumes:
      - ./data:/app/data
      - ./pipeline:/app/pipeline
    networks:
      - immo_network
    depends_on:
      - spark

  # ── Airflow ───────────────────────────────────────────────────────────────────
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: id_immobilier_airflow:latest
    container_name: id_immobilier_airflow
    restart: always
    environment:
      # SequentialExecutor compatible avec SQLite
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=id_immobilier_secret
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=id_immobilier
    ports:
      - "8081:8080"
    volumes:
      - ./pipeline/dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./data:/opt/airflow/data
      - ./sql:/opt/airflow/sql
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username admin
          --password admin1234
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@idimmobilier.tg || true &&
        airflow webserver &
        airflow scheduler
      "
    networks:
      - immo_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Streamlit ─────────────────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: id_immobilier_streamlit
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=id_immobilier
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app/dashboard
      - ./data:/app/data
    networks:
      - immo_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: id_immobilier_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db
    networks:
      - immo_network

  # ── FastAPI ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: id_immobilier_api
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=id_immobilier
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./data:/app/data
    networks:
      - immo_network
    depends_on:
      - mongo

  # ── Frontend React ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: id_immobilier_frontend
    restart: always
    ports:
      - "3000:3000"
    networks:
      - immo_network

  # ── Admin React ──────────────────────────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: id_immobilier_admin
    restart: always
    ports:
      - "3001:3001"
    networks:
      - immo_network

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  airflow_logs:

# ── Reseau interne ────────────────────────────────────────────────────────────
networks:
  immo_network:
    driver: bridge